<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><style>text{font-family:-apple-system,'SF Pro Text','PingFang SC','Segoe UI',Roboto,sans-serif}</style><defs><filter id="e1" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07"/></filter><filter id="e2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-opacity="0.10"/></filter><filter id="e3" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="28" flood-opacity="0.16"/></filter></defs><rect x="0" y="0" width="390" height="844" fill="#FFFFFF" pointer-events="none"/><g id="n_root" data-kind="frame"><rect x="0" y="0" width="390" height="844" rx="0" fill="none" stroke="#C8CDD6" stroke-width="1" stroke-dasharray="4 3"/><g id="n_top_bar" data-kind="rect"><rect x="0" y="0" width="390" height="56" rx="0" fill="#FFFFFF"/><text x="12" y="32.9" text-anchor=" start" font-size="14" font-weight="normal" fill="#111111">Chats</text></g><g id="n_chat_0" data-kind="frame"><rect x="12" y="68" width="366" height="64" rx="10" fill="none"/><text x="24" y="104.9" text-anchor=" start" font-size="14" font-weight="normal" fill="#111111">Alice — See you tomorrow!</text></g><g id="n_chat_1" data-kind="frame"><rect x="12" y="140" width="366" height="64" rx="10" fill="none"/><text x="24" y="176.9" text-anchor=" start" font-size="14" font-weight="normal" fill="#111111">Bob — The prototype looks great</text></g><g id="n_chat_2" data-kind="frame"><rect x="12" y="212" width="366" height="64" rx="10" fill="none"/><text x="24" y="248.9" text-anchor=" start" font-size="14" font-weight="normal" fill="#111111">Carol — Design sync at 3pm</text></g><g id="n_chat_3" data-kind="frame"><rect x="12" y="284" width="366" height="64" rx="10" fill="none"/><text x="24" y="320.9" text-anchor=" start" font-size="14" font-weight="normal" fill="#111111">Dave — Sent the files over</text></g><g i