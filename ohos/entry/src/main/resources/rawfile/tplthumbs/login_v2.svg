<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><style>text{font-family:-apple-system,'SF Pro Text','PingFang SC','Segoe UI',Roboto,sans-serif}</style><defs><filter id="e1" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07"/></filter><filter id="e2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-opacity="0.10"/></filter><filter id="e3" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="28" flood-opacity="0.16"/></filter></defs><rect x="0" y="0" width="1280" height="800" fill="#FFFFFF" pointer-events="none"/><g id="n_root" data-kind="frame"><rect x="0" y="0" width="1280" height="800" rx="0" fill="none" stroke="#C8CDD6" stroke-width="1" stroke-dasharray="4 3"/><g id="n_page" data-kind="frame"><rect x="0" y="0" width="1280" height="800" rx="0" fill="none" stroke="#C8CDD6" stroke-width="1" stroke-dasharray="4 3"/><g id="n_top_sp" data-kind="rect"><rect x="24" y="24" width="1232" height="146" rx="0" fill="none" stroke="#C8CDD6" stroke-width="1" stroke-dasharray="4 3"/></g><g id="n_login_card" data-kind="frame"><rect x="24" y="170" width="420" height="460" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#e2)"/><g id="n_logo" data-kind="rect"><rect x="206" y="198" width="56" height="56" rx="999" fill="#4B6BFB"/></g><g id="n_title" data-kind="text"><text x="52" y="298" font-size="32" font-weight="700" letter-spacing="0" fill="#1F2328">Welcome back</text></g><g id="n_sub" data-kind="text"><text x="52" y="341" font-size="15" font-weight="400" letter-spacing="0" fill="#5A6270">Sign in to continue</text></g><g id="n_email" data-kind="rect"><rect x="52" y="360.5" width="364" height="46" rx="10" fill="#FFFFFF" stroke="#DDE1E6" stroke-width="1" filter="url(#e1)"/><text x="64" y="388.4" text-anchor=" start" font-size="14" font-weight="normal" fill="#8A919C">Email address</text></g><g id="n_pass" data-kind="rect"><rect x="52" y="418.5" width="364" height="46" rx="10" fill="#FFFFFF" stroke="#DDE1E6" stroke-width="1" filter="url(#e1)"/><text x="64" y="446.4" text-anchor=" start" font-size="14" font-weight="normal" fill="#8A919C">Password</text></g><g id="n_forgot" data-kind="text"><text x="52" y="489" font-size="12.5" font-weight="400" letter-spacing="0" fill="#4B6BFB">Forgot password?</text></g><g id="n_login_btn" data-kind="rect"><rect x="52" y="507.25" width="152" height="44" rx="10" fill="#4B6BFB" filter="url(#e1)"/><text x="64" y="534.15" text-anchor=" start" font-size="14" font-weight="normal" fill="#FFFFFF">Sign In</text></g><g id="n_signup" data-kind="text"><text x="52" y="575.75" font-size="12.5" font-weight="400" letter-spacing="0" fill="#5A6270">No account? Create one</text></g></g><g id="n_bot_sp" data-kind="rect"><rect x="24" y="630" width="1232" height="146" rx="0" fill="none" stroke="#C8CDD6" stroke-width="1" stroke-dasharray="4 3"/></g></g></g></svg>