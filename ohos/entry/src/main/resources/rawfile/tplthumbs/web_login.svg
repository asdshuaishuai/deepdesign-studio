<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"><style>text{font-family:-apple-system,'SF Pro Text','PingFang SC','Segoe UI',Roboto,sans-serif}</style><defs><filter id="e1" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07"/></filter><filter id="e2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-opacity="0.10"/></filter><filter id="e3" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="28" flood-opacity="0.16"/></filter></defs><rect x="0" y="0" width="1280" height="800" fill="#FFFFFF" pointer-events="none"/><g id="n_root" data-kind="frame"><rect x="0" y="0" width="1280" height="800" rx="0" fill="none" stroke="#C8CDD6" stroke-width="1" stroke-dasharray="4 3"/><g id="n_brand_pane" data-kind="rect"><rect x="0" y="0" width="560" height="800" rx="0" fill="#4B6BFB"/><g id="n_brand_logo" data-kind="rect"><rect x="96" y="120" width="64" height="64" rx="999" fill="#FFFFFF"/></g><g id="n_brand_title" data-kind="text"><text x="96" y="352" font-size="32" font-weight="normal" letter-spacing="0" fill="#FFFFFF"><tspan x="96" dy="0">Design together</tspan><tspan x="96" dy="48">with your agent</tspan></text></g><g id="n_brand_sub" data-kind="text"><text x="96" y="466" font-size="14" font-weight="normal" letter-spacing="0" fill="#DCE3FF">One plain-text source of truth for humans and AI.</text></g></g><g id="n_form_card" data-kind="rect"><rect x="680" y="180" width="440" height="440" rx="16" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1"/><g id="n_wl_title" data-kind="text"><text x="716" y="240" font-size="20" font-weight="normal" letter-spacing="0" fill="#1A1C1E">Welcome back</text></g><g id="n_wl_sub" data-kind="text"><text x="716" y="268" font-size="14" font-weight="normal" letter-spacing="0" fill="#42474F">Sign in to continue</text></g><g id="n_wl_email" data-kind="rect"><rect x="716" y="304" width="368" height="48" rx="10" fill="#E8EAF6"/><text x="728" y="332.9" text-anchor=" start" font-size="14" font-weight="normal" fill="#111111">Email address</text></g><g id="n_wl_pass" data-kind="rect"><rect x="716" y="364" width="368" height="48" rx="10" fill="#E8EAF6"/><text x="728" y="392.9" text-anchor=" start" font-size="14" font-weight="normal" fill="#111111">Password</text></g><g id="n_wl_forgot" data-kind="text"><text x="940" y="436" font-size="12" font-weight="normal" letter-spacing="0" fill="#9098A1">Forgot password?</text></g><g id="n_wl_btn" data-kind="rect"><rect x="716" y="460" width="368" height="48" rx="10" fill="#4B6BFB"/><text x="728" y="488.9" text-anchor=" start" font-size="14" font-weight="normal" fill="#FFFFFF">Sign In</text></g><g id="n_wl_signup" data-kind="text"><text x="796" y="552" font-size="12" font-weight="normal" letter-spacing="0" fill="#9098A1">No account? Create one</text></g></g></g></svg>