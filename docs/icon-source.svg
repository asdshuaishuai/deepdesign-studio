<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <defs>
    <clipPath id="sq"><rect width="512" height="512" rx="128"/></clipPath>
    <radialGradient id="bg" cx=".5" cy=".38" r=".9">
      <stop offset="0" stop-color="#1C1C22"/>
      <stop offset=".62" stop-color="#0C0C10"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".7" stop-color="#EEF0F6"/>
      <stop offset="1" stop-color="#D8DCE6"/>
    </linearGradient>
    <linearGradient id="beret" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8556F"/>
      <stop offset=".6" stop-color="#C4304E"/>
      <stop offset="1" stop-color="#8E1F38"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C05A"/>
      <stop offset=".6" stop-color="#DE9F2E"/>
      <stop offset="1" stop-color="#9C6A14"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AC8FA"/>
      <stop offset=".5" stop-color="#8F7BF6"/>
      <stop offset="1" stop-color="#F27DB8"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- 柔光笔触：圆润低语的背景点缀 -->
    <path d="M 96 350 C 150 210 300 160 402 200 C 452 220 468 292 424 344
             C 366 410 236 430 150 396 C 108 378 84 366 96 350"
          stroke="url(#stroke)" stroke-width="17" stroke-linecap="round" fill="none" opacity=".28"/>
    <path d="M 150 318 C 196 226 300 192 372 220"
          stroke="url(#stroke)" stroke-width="8" stroke-linecap="round" fill="none" opacity=".16"/>

    <!-- 白色胖鲸：圆润流线主体（头部右，尾部左下） -->
    <g>
      <!-- 尾鳍（圆润双叶） -->
      <path d="M 150 330 C 120 354 80 364 52 356 C 44 340 60 316 94 304
               C 116 296 138 304 150 318 C 154 322 154 326 150 330 Z" fill="url(#whale)"/>
      <path d="M 150 330 C 128 364 96 390 66 388 C 58 372 70 346 102 326
               C 122 314 140 320 150 330 Z" fill="url(#whale)"/>

      <!-- 主躯干：更胖更圆的流线 -->
      <path d="M 142 330
               C 160 258 216 190 296 172
               C 368 156 424 192 440 240
               C 454 282 430 322 376 344
               C 300 374 198 378 152 344
               C 146 340 143 336 142 330 Z" fill="url(#whale)"/>

      <!-- 背鳍（圆顶水滴形，与整体圆润语言统一） -->
      <path d="M 234 188 C 240 138 256 100 282 84
               C 292 78 302 84 300 96
               C 296 122 292 148 300 172
               C 298 180 288 182 278 178
               C 262 172 246 178 234 188 Z" fill="url(#whale)"/>

      <!-- 眼斑（深色椭圆，白身上的虎鲸印记） -->
      <ellipse cx="352" cy="196" rx="30" ry="15" transform="rotate(-16 352 196)" fill="#C9CEDB" opacity=".85"/>

      <!-- 眼睛（深色圆点 + 高光，圆润有神） -->
      <circle cx="368" cy="222" r="13" fill="#1B1B22"/>
      <circle cx="368" cy="222" r="11" fill="#2A2A34"/>
      <circle cx="364" cy="218" r="4.5" fill="#FFFFFF"/>
      <circle cx="372" cy="226" r="2" fill="#B8C4D8"/>

      <!-- 微笑（圆润弧线） -->
      <path d="M 376 248 C 396 258 420 254 434 244"
            stroke="#1B1B22" stroke-width="6" stroke-linecap="round" fill="none"/>

      <!-- 腮红（柔和暖点） -->
      <ellipse cx="380" cy="238" rx="13" ry="6" fill="#E8556F" opacity=".28"/>

      <!-- 胸鳍（圆润短鳍） -->
      <path d="M 306 316 C 330 352 356 378 380 370
               C 392 358 366 318 338 292 C 324 300 312 306 306 316 Z" fill="url(#whale)"/>
      <path d="M 316 320 C 334 346 354 362 370 358"
            stroke="#C9CEDB" stroke-width="4" stroke-linecap="round" fill="none" opacity=".7"/>
    </g>

    <!-- 贝雷帽（降饱和玫瑰红，圆润贴头） -->
    <g>
      <path d="M 300 168 C 286 130 346 102 394 126
               C 414 136 408 158 384 162
               C 344 168 312 172 300 168 Z" fill="url(#beret)"/>
      <path d="M 310 166 C 332 158 372 158 392 164
               C 382 172 330 174 310 166 Z" fill="#701426"/>
      <path d="M 344 118 C 342 110 348 106 346 100"
            stroke="#E8556F" stroke-width="5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- 画笔（暖黄圆润，斜衔于嘴边） -->
    <g transform="translate(398,250) rotate(-14)">
      <path d="M -54 4 L 22 4 L 22 12 L -54 12 Z" fill="url(#wood)" rx="3"/>
      <rect x="22" y="2" width="14" height="12" rx="4" fill="#C9CEDB"/>
      <path d="M 36 2 C 48 -2 60 6 66 8 C 60 10 48 18 36 14 Z" fill="#F27DB8"/>
      <path d="M 52 6 C 58 6 64 8 68 8 C 64 9 58 10 52 9 Z" fill="#FFFFFF"/>
    </g>

    <!-- 底部柔和反光，增强圆润质感 -->
    <ellipse cx="256" cy="472" rx="180" ry="20" fill="#FFFFFF" opacity=".05"/>
  </g>
</svg>
