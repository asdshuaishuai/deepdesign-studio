name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout deepDesign
        uses: actions/checkout@v4

      # Cargo.toml 的 moonviz-ddp 依赖指向仓库外兄弟目录 ../../moonviz，
      # CI 中将引擎仓库 checkout 到工作区旁（D:\a\<repo>\moonviz）以对齐路径。
      - name: Checkout MoonViz engine (sibling path)
        uses: actions/checkout@v4
        with:
          repository: asdshuaishuai/moonviz
          ref: main
          path: ../moonviz

      - name: Install MoonBit toolchain (Windows)
        shell: powershell
        run: irm https://cli.moonbitlang.com/install/powershell.ps1 | iex

      - name: Build MoonViz CLI binary (embedded into installer)
        shell: powershell
        run: |
          $env:Path = "$env:USERPROFILE\.moon\bin;$env:Path"
          moon version
          moon build --release --target native cli
          "list-templates", "exit" | &_build/native/release/build/cli/cli.exe | Select-String '"login"'
        working-directory: ../moonviz
        # 产物经 beforeBuildCommand(sync-engine.mjs) 以 engine/moonviz-cli.exe
        # 打进安装包，最终用户无需安装 MoonBit 工具链；Agent 基座为 Rust 进程内
        # 实现（无 JS 运行时），node 仅用于构建期脚本

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build NSIS installer
        run: npx @tauri-apps/cli@^2 build --bundles nsis
        env:
          # 引擎路径依赖已由兄弟 checkout 对齐；CI 只做构建产物，不签名
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepDesign-Studio-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
