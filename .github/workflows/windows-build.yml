name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout deepDesign
        uses: actions/checkout@v4

      # Cargo.toml 的 moonviz-ddp 依赖指向仓库外兄弟目录 ../../moonviz，
      # CI 中将引擎仓库 checkout 到工作区旁（D:\a\<repo>\moonviz）以对齐路径。
      - name: Checkout MoonViz engine (sibling path)
        uses: actions/checkout@v4
        with:
          repository: asdshuaishuai/moonviz
          ref: main
          path: ../moonviz

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install agent bridge dependencies
        run: npm ci
        working-directory: agent
        # bundle.resources 会把 agent/node_modules 一并打进安装包

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build NSIS installer
        run: npx @tauri-apps/cli@^2 build --bundles nsis
        env:
          # 引擎路径依赖已由兄弟 checkout 对齐；CI 只做构建产物，不签名
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepDesign-Studio-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
