name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout deepDesign
        uses: actions/checkout@v4

      # 引擎以预编译 wasm 产物集成：sync-engine.mjs 从 GitHub Releases 直链拉取
      # classic wasm（版本锚定 + sha512 校验 + 真机契约探针）到 frontend/vendor/。
      # 无 MoonBit 工具链、无兄弟仓库依赖。
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch prebuilt engine (sync-engine.mjs)
        shell: bash
        run: node scripts/sync-engine.mjs

      - name: Frontend smoke + wasm contract (test_studio.cjs)
        shell: bash
        run: node test_studio.cjs

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Rust 侧测试：V8 宿主在进程内实例化同一份 wasm 产物
      # （agent e2e 用 mock LLM 端点，不出网）
      - name: Run cargo tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Build NSIS installer
        run: npx @tauri-apps/cli@^2 build --bundles nsis
        env:
          # CI 只做构建产物，不签名
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepDesign-Studio-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          generate_release_notes: true
