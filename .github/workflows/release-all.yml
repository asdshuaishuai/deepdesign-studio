name: Release All Platforms

# 全平台打包：Windows(NSIS) / macOS(dmg) / Linux(deb+AppImage)
# 触发：打 tag v* 或手动。产物自动附加到 GitHub Release，并上传固定名副本
# 供官网「最新版下载」直链使用（releases/latest/download/<固定名>）。

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    steps:
      - name: Checkout deepDesign
        uses: actions/checkout@v4

      # 引擎以预编译 wasm 产物集成：sync-engine.mjs 从 GitHub Releases 直链拉取
      # classic wasm（版本锚定 + sha512 校验 + 真机契约探针）。无 MoonBit 工具链。
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 分支纪律：tag 只允许打在发布分支 main 上（dev 是开发分支）。
      # 直接给 dev 打 tag 会产出「比 main 还新」的正式包，两边从此说不清谁是谁。
      # 用 compare API 判定（base=main, head=tag 提交）：tag 在 main 上 → behind/identical。
      # 不用本地 git 祖先判定——checkout 是浅克隆，历史不全时 merge-base 会给出错误结论。
      - name: Assert the tag is on the release branch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${{ github.repository }}/compare/main...${GITHUB_SHA}" --jq '.status')
          echo "compare main...${GITHUB_SHA} → $status"
          case "$status" in
            behind|identical) echo "✓ tag $GITHUB_REF_NAME 在 main 上" ;;
            *) echo "::error::tag $GITHUB_REF_NAME 不在 main 上（status=$status）——发布必须走 dev → main → tag（见 AGENTS.md 分支纪律）"; exit 1 ;;
          esac

      - name: Fetch prebuilt engine (sync-engine.mjs)
        shell: bash
        run: node scripts/sync-engine.mjs

      # 版本号一致性（VERSION 单源）：任一产物面漂移即失败，
      # 防止「桌面显示 0.4.1、鸿蒙包停在 0.4.0」这类对不上账的发布
      - name: Version surfaces match VERSION
        shell: bash
        run: node scripts/sync-version.mjs --check

      - name: Frontend smoke + wasm contract (test_studio.cjs)
        shell: bash
        run: node test_studio.cjs

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system deps (webkit2gtk-4.1 stack)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse3-dev erofs-utils \
            libglib2.0-dev librsvg2-bin

      - name: Run cargo tests
        if: matrix.platform != 'macos'
        working-directory: src-tauri
        run: cargo test --release

      - name: Build Windows installer (NSIS)
        if: matrix.platform == 'windows'
        run: npx @tauri-apps/cli@^2 build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Build macOS bundle (dmg)
        if: matrix.platform == 'macos'
        run: npx @tauri-apps/cli@^2 build --bundles dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''

      - name: Build Linux packages (deb + AppImage)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          chmod +x scripts/build-packages.sh
          # deb + AppImage：脚本会从 deepin 仓库收集 WebKitGTK 运行库捆绑进包
          ./scripts/build-packages.sh --deb --appimage

      - name: Collect artifacts (stable names for latest/download links)
        shell: bash
        run: |
          mkdir -p dist-release
          # Windows
          if compgen -G "src-tauri/target/release/bundle/nsis/*.exe" > /dev/null; then
            cp src-tauri/target/release/bundle/nsis/*.exe \
               "dist-release/deepDesign-Studio-${GITHUB_REF_NAME}-windows-x64-setup.exe"
          fi
          # macOS
          if compgen -G "src-tauri/target/release/bundle/dmg/*.dmg" > /dev/null; then
            cp src-tauri/target/release/bundle/dmg/*.dmg \
               "dist-release/deepDesign-Studio-${GITHUB_REF_NAME}-macos-arm64.dmg"
          fi
          # Linux
          [ -f "dist/${PKG_NAME}.deb" ] || true
          for f in dist/*.deb; do
            [ -f "$f" ] && cp "$f" "dist-release/deepdesign-studio-${GITHUB_REF_NAME}-linux-amd64.deb"
          done
          for f in dist/*.AppImage; do
            [ -f "$f" ] && cp "$f" "dist-release/deepDesign-Studio-${GITHUB_REF_NAME}-x86_64.AppImage"
          done
          ls -la dist-release
        env:
          PKG_NAME: deepdesign-studio

      - name: Upload artifacts (every branch run)
        uses: actions/upload-artifact@v4
        with:
          name: deepDesign-Studio-${{ matrix.platform }}
          path: dist-release/*
          if-no-files-found: warn

      # 是否由本次构建生成发布说明：只在「Release 尚无正文」时生成，且只由矩阵里的
      # 一个平台负责（三个平台同时写正文会互相覆盖——v0.4.1 的发布日志就是这么变成
      # 三段重复的 PR 列表的）。已有正文（人工写的正式说明）一律不覆盖。
      - name: Decide who writes the release body
        id: notes
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macos'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh api "repos/${{ github.repository }}/releases/tags/${GITHUB_REF_NAME}" \
            --jq '.body // ""' 2>/dev/null || echo "")
          if [ -n "$(printf '%s' "$existing" | tr -d '[:space:]')" ]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            echo "Release 已有正文，保留不改写"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
