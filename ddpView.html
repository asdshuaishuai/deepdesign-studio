<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ddpView · 只读查看器</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f4f5f7;color:#20242b}header{padding:14px 20px;background:#20252d;color:white;display:flex;gap:12px;align-items:center}main{padding:20px}form,.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}button,input,select{font:inherit;padding:8px;border:1px solid #bbb;border-radius:6px}button{cursor:pointer}button:disabled{cursor:wait;opacity:.6}#viewport{height:calc(100vh - 220px);min-height:300px;overflow:auto;border:1px solid #ddd;border-radius:8px;background:#e9ebef;padding:20px}#stage{display:block;border:0;background:white;margin:auto}#status{min-height:24px}.error{color:#a52020}:focus-visible{outline:3px solid #3988ed;outline-offset:2px}
</style></head><body><header><strong>ddpView</strong><span>只读 DDP 查看器</span></header><main>
<form id="open-form"><label>文档 <input id="file" type="file" accept=".ddp,application/octet-stream" required></label><label>密码 <input id="password" type="password" autocomplete="off" required></label><button id="open" type="submit">打开并渲染</button></form>
<div class="toolbar"><label>画板 <select id="boards" disabled></select></label><button id="fit" disabled>适应窗口</button><button id="minus" aria-label="缩小" disabled>−</button><output id="zoom">100%</output><button id="plus" aria-label="放大" disabled>＋</button></div>
<p id="status" role="status" aria-live="polite">请选择 DDP 文件。此查看器只解密、校验和渲染。</p><div id="viewport" aria-busy="false"><iframe id="stage" title="画板预览" sandbox="" hidden></iframe></div>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
let boards=[],flows=[],scale=1,fitMode=true,currentIndex=0;
const b64=bytes=>{let s='';for(let i=0;i<bytes.length;i+=8192)s+=String.fromCharCode(...bytes.subarray(i,i+8192));return btoa(s)}
function nextBoard(id){const index=boards.findIndex(a=>a.id===id);if(index<0)return;currentIndex=index;$('boards').value=String(index);fitMode=true;showBoard()}
function resize(){const art=boards[currentIndex];if(!art)return;const w=Number(art.width)||390,h=Number(art.height)||844;if(fitMode)scale=Math.min(($('viewport').clientWidth-42)/w,($('viewport').clientHeight-42)/h,2);scale=Math.max(.05,Math.min(4,scale));$('stage').style.width=w*scale+'px';$('stage').style.height=h*scale+'px';$('zoom').textContent=Math.round(scale*100)+'%'}
function showBoard(){const art=boards[currentIndex];if(!art)return;const svg=new DOMParser().parseFromString(art.svg,'image/svg+xml');if(svg.querySelector('parsererror')||svg.documentElement.localName!=='svg')throw Error('画板 SVG 无效');const targets=flows.filter(f=>f.from===art.id&&String(f.trigger||'').startsWith('tap:')).map(f=>[String(f.trigger).slice(4),f.to]);for(const [nodeId,target] of targets){const node=svg.getElementById('n_'+nodeId);if(node){node.setAttribute('data-ddp-target',target);node.setAttribute('tabindex','0');node.setAttribute('role','button');node.addEventListener('click',()=>nextBoard(target));node.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();nextBoard(target)}})}}svg.documentElement.setAttribute('width','100%');svg.documentElement.setAttribute('height','100%');$('stage').srcdoc='<!doctype html><meta http-equiv="Content-Security-Policy" content="default-src \'none\'; style-src \'unsafe-inline\'; img-src data:"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}svg{display:block}[data-ddp-target]{cursor:pointer;outline:2px dashed #21a366;outline-offset:3px}</style>'+new XMLSerializer().serializeToString(svg);$('stage').hidden=false;resize()}

$('boards').onchange=()=>{currentIndex=Number($('boards').value);fitMode=true;showBoard()};$('fit').onclick=()=>{fitMode=true;resize()};$('minus').onclick=()=>{fitMode=false;scale/=1.2;resize()};$('plus').onclick=()=>{fitMode=false;scale*=1.2;resize()};window.addEventListener('resize',resize);
$('password').onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();$('password').value='';$('file').focus()}};
$('open-form').onsubmit=async e=>{e.preventDefault();const file=$('file').files[0];if(!file)return;let password=$('password').value;$('password').value='';$('open').disabled=true;$('viewport').setAttribute('aria-busy','true');$('status').className='';$('status').textContent='正在解密、校验和渲染…';try{if(file.size>16*1024*1024+45)throw Error('DDP 文件过大');const response=await fetch('/api/ddp/view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ddp_b64:b64(new Uint8Array(await file.arrayBuffer())),password})});password='';const view=await response.json();if(!response.ok||!view.ok)throw Error(view.error||'打开失败');if(!Array.isArray(view.artboards)||!view.artboards.length)throw Error('文档没有可渲染画板');boards=view.artboards;flows=Array.isArray(view.flows)?view.flows:[];currentIndex=Math.max(0,boards.findIndex(a=>a.id===view.entry));$('boards').replaceChildren(...boards.map((a,i)=>new Option(a.name||a.id,String(i))));$('boards').value=String(currentIndex);for(const id of ['boards','fit','minus','plus'])$(id).disabled=false;fitMode=true;showBoard();$('status').textContent=file.name+' · '+boards.length+' 个画板 · 只读';}catch(err){$('status').className='error';$('status').textContent=err.message==='ddp_authentication_failed'?'密码错误或文件已损坏。':String(err.message);$('password').focus()}finally{password='';$('password').value='';$('open').disabled=false;$('viewport').setAttribute('aria-busy','false')}};
</script></body></html>
