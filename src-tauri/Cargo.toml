[package]
name = "deepdesign-studio"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# DDP 编解码 crate：vendored 副本（引擎预编译化后不再依赖兄弟仓库源码）。
# 来源与同步方式见 vendor/moonviz-ddp/README.md。
moonviz-ddp = { path = "../vendor/moonviz-ddp" }
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
zeroize = "1.8"
# Agent 基座（进程内，无 JS 运行时）：自有 reqwest 直发 OpenAI chat-completions /
# Anthropic Messages wire format。async-openai 以【纯类型层】采用（chat-completion-types：
# 仅 derive_builder+bytes，不带 HTTP client 与 aws-lc/quinn 等传递重量链）：请求骨架与
# tools schema 用 SDK 类型构造，序列化后合并 provider 回显的原始 messages 与 thinking
# 家族等非标字段再发送；响应侧保持 raw Value（SDK 自家 issue #498/#503：严格响应枚举
# 在兼容网关上会碎，reasoning_content 等非标字段过 typed 往返会丢）。byot/full-client
# 路线已评估并拒绝：byot 只是把任意 Value 发出去（零类型收益）且引入 SDK 的 HTTP 栈。
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time", "net", "sync"] }
wasmtime = "49.0.0"
async-openai = { version = "0.42.0", default-features = false, features = ["chat-completion-types"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lib]
name = "deepdesign_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
