[package]
name = "deepdesign_core"
version = "0.4.0-beta"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi-ohos = { version = "1.0", default-features = false, features = ["napi8", "async"] }
napi-derive-ohos = "1.0"
hilog-binding = "0.0.4"

[profile.release]
opt-level = 3
lto = false

[build-dependencies]
napi-build-ohos = "1.0"
