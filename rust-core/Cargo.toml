[package]
name = "deepdesign_core"
version = "0.4.0-beta"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["napi"]
napi = ["dep:napi-ohos", "dep:napi-derive-ohos"]

[dependencies]
napi-ohos = { version = "1.0", default-features = false, features = ["napi8", "async"], optional = true }
napi-derive-ohos = { version = "1.0", optional = true }
# DDP 认证加密容器（与桌面版 src-tauri 同一份 vendored codec——同一 .ddp 两端互通）
moonviz-ddp = { path = "../vendor/moonviz-ddp" }
base64 = "0.22"

# hilog 仅存在于 OHOS 目标（host 测试/CI 不需要链接 OHOS 系统库）
[target.'cfg(target_env = "ohos")'.dependencies]
hilog-binding = "0.0.4"

[profile.release]
opt-level = 3
lto = false

[build-dependencies]
napi-build-ohos = "1.0"
